name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: AbsalaoDev
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23A970FF&color_dots=%2317151D,%232B1745,%235B2A91,%238A2BE2,%23C4A1FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A970FF

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
